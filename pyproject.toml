[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.4.1"
description = "Yet another langchain-esque package to use language agents and compose agent-systems"
readme = "README.md"
requires-python = ">=3.12"
license = "CC0-1.0"
authors = [
    { name = "Sean Browning", email = "sbrowning@cdc.gov" },
]
dependencies = [
    "aiohttp==3.14.1",
    "azure-core==1.30.1",
    "azure-identity==1.16.0",
    "backoff==2.2.1",
    "openai>=1.40.0",
    "polars>=1.6.0",
    "pydantic>=2.9.2",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/cdcai/agents"

[tool.setuptools.packages.find]
include = ["agents", "agents.*"]
